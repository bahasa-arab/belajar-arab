<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belajar Arab: Kosakata Sehari-hari</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@400;700&display=swap">
<style>
:root{
  --bg:#f3efe6; --surface:#fffdf8; --ink:#1f2a2e; --muted:#5d6b6f;
  --accent:#0f6b5c; --accent-ink:#ffffff; --line:#d9d2c0; --back:#e3efe9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14201f; --surface:#1c2c2a; --ink:#eef2ee; --muted:#a3b4b0;
    --accent:#4fc3a8; --accent-ink:#0b1f1b; --line:#2f4541; --back:#223a36;
  }
}
:root[data-theme="dark"]{
  --bg:#14201f; --surface:#1c2c2a; --ink:#eef2ee; --muted:#a3b4b0;
  --accent:#4fc3a8; --accent-ink:#0b1f1b; --line:#2f4541; --back:#223a36;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;min-height:100vh}
main{max-width:30rem;margin:0 auto;padding:1.25rem 1rem 2rem}
h1{font-size:1.35rem;margin:.25rem 0 .25rem}
.sub{color:var(--muted);margin:0 0 1rem;font-size:.95rem}
.tabs{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:.75rem}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.5rem .9rem;border-radius:999px;font:inherit;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{color:var(--muted);font-size:.9rem;margin:0 0 .5rem}
.card{width:100%;min-height:16rem;border:1px solid var(--line);border-radius:1rem;background:var(--surface);color:var(--ink);padding:1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6rem;cursor:pointer;font:inherit}
.card.flipped{background:var(--back)}
.ar{font-family:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;font-size:3.2rem;line-height:1.6;direction:rtl}
.latin{font-size:1.15rem;color:var(--muted);font-style:italic}
.arti{font-size:1.8rem;font-weight:700}
.hint{font-size:.85rem;color:var(--muted)}
.row{display:flex;gap:.6rem;margin-top:1rem}
.row button{flex:1;padding:.8rem;border-radius:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.row button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Belajar Arab sehari-hari</h1>
  <p class="sub">Ketuk kartu untuk melihat arti. Tulisan Arab dibaca dari kanan ke kiri.</p>
  <div class="tabs" id="tabs" role="group" aria-label="Pilih topik"></div>
  <p class="count" id="count"></p>
  <button class="card" id="card" aria-live="polite"></button>
  <div class="row">
    <button id="prev">Sebelumnya</button>
    <button id="shuffle">Acak</button>
    <button id="next" class="main">Berikutnya</button>
  </div>
</main>
<script>
var DATA = {
  "Salam": [
    ["السَّلَامُ عَلَيْكُمْ","as-salāmu ʿalaikum","Semoga keselamatan atas kalian (salam)"],
    ["وَعَلَيْكُمُ السَّلَامُ","wa ʿalaikumus-salām","Dan atas kalian keselamatan (balasan salam)"],
    ["صَبَاحُ الْخَيْرِ","shabāhul-khair","Selamat pagi"],
    ["مَسَاءُ الْخَيْرِ","masā’ul-khair","Selamat sore"],
    ["شُكْرًا","syukran","Terima kasih"],
    ["عَفْوًا","ʿafwan","Sama-sama / maaf"],
    ["مَعَ السَّلَامَةِ","maʿas-salāmah","Sampai jumpa"]
  ],
  "Ungkapan": [
    ["بَارَكَ اللهُ فِيكَ","bārakallāhu fīka","Semoga Allah memberkahimu (untuk laki-laki)"],
    ["بَارَكَ اللهُ فِيكِ","bārakallāhu fīki","Semoga Allah memberkahimu (untuk perempuan)"],
    ["جَزَاكَ اللهُ خَيْرًا","jazākallāhu khairan","Semoga Allah membalasmu dengan kebaikan"],
    ["وَإِيَّاكَ","wa iyyāk","Dan kepadamu juga (balasan jazākallāhu khairan)"],
    ["بِسْمِ اللهِ","bismillāh","Dengan nama Allah"],
    ["الْحَمْدُ لِلّٰهِ","alḥamdulillāh","Segala puji bagi Allah"],
    ["إِنْ شَاءَ اللهُ","in syā’ Allāh","Jika Allah menghendaki"],
    ["مَا شَاءَ اللهُ","mā syā’ Allāh","Atas kehendak Allah (ungkapan kagum)"],
    ["سُبْحَانَ اللهِ","subḥānallāh","Maha Suci Allah"],
    ["اللهُ أَكْبَرُ","Allāhu akbar","Allah Maha Besar"],
    ["أَسْتَغْفِرُ اللهَ","astaghfirullāh","Aku memohon ampun kepada Allah"],
    ["أَهْلًا وَسَهْلًا","ahlan wa sahlan","Selamat datang"],
    ["كَيْفَ حَالُكَ؟","kaifa ḥāluka?","Apa kabar? (untuk laki-laki)"],
    ["بِخَيْرٍ، الْحَمْدُ لِلّٰهِ","bi-khair, alḥamdulillāh","Baik, alhamdulillah"]
  ],
  "Angka": [
    ["وَاحِدٌ","wāḥid","Satu"],
    ["اثْنَانِ","itsnān","Dua"],
    ["ثَلَاثَةٌ","tsalātsah","Tiga"],
    ["أَرْبَعَةٌ","arbaʿah","Empat"],
    ["خَمْسَةٌ","khamsah","Lima"]
  ],
  "Keluarga": [
    ["أَبٌ","ab","Ayah"],
    ["أُمٌّ","umm","Ibu"],
    ["أَخٌ","akh","Saudara laki-laki"],
    ["أُخْتٌ","ukht","Saudara perempuan"]
  ],
  "Benda": [
    ["مَاءٌ","mā’","Air"],
    ["خُبْزٌ","khubz","Roti"],
    ["بَيْتٌ","bait","Rumah"],
    ["كِتَابٌ","kitāb","Buku"],
    ["نَعَمْ","naʿam","Ya"],
    ["لَا","lā","Tidak"]
  ]
};
var topics = ["Semua"].concat(Object.keys(DATA));
var topic = "Semua", deck = [], i = 0, flipped = false;

function build(){
  deck = [];
  Object.keys(DATA).forEach(function(k){
    if(topic === "Semua" || topic === k){ deck = deck.concat(DATA[k]); }
  });
  i = 0; flipped = false; render();
}
function render(){
  var c = deck[i], card = document.getElementById("card");
  card.classList.toggle("flipped", flipped);
  card.innerHTML = flipped
    ? '<div class="arti"></div><div class="latin"></div><div class="hint">Ketuk untuk kembali</div>'
    : '<div class="ar"></div><div class="hint">Ketuk untuk melihat arti</div>';
  if(flipped){
    card.querySelector(".arti").textContent = c[2];
    card.querySelector(".latin").textContent = c[1];
  } else {
    card.querySelector(".ar").textContent = c[0];
  }
  document.getElementById("count").textContent = "Kartu " + (i+1) + " dari " + deck.length;
}
function go(d){ i = (i + d + deck.length) % deck.length; flipped = false; render(); }
function shuffle(){
  for(var n = deck.length - 1; n > 0; n--){
    var j = Math.floor(Math.random() * (n+1)), t = deck[n]; deck[n] = deck[j]; deck[j] = t;
  }
  i = 0; flipped = false; render();
}
var tabsEl = document.getElementById("tabs");
topics.forEach(function(t){
  var b = document.createElement("button");
  b.textContent = t; b.setAttribute("aria-pressed", t === topic);
  b.onclick = function(){
    topic = t;
    Array.prototype.forEach.call(tabsEl.children, function(x){ x.setAttribute("aria-pressed", x.textContent === t); });
    build();
  };
  tabsEl.appendChild(b);
});
document.getElementById("card").onclick = function(){ flipped = !flipped; render(); };
document.getElementById("next").onclick = function(){ go(1); };
document.getElementById("prev").onclick = function(){ go(-1); };
document.getElementById("shuffle").onclick = shuffle;
build();
</script>
</body>
</html>
